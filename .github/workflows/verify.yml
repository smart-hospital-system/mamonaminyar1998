name: Verify

# Runs on every pull request and on pushes to the working branches.
# Deliberately limited to checks that need no secrets, no database and no network
# beyond npm: the hospital is an on-premise application, so CI only proves the
# source is sound — type-checks, builds and contains no committed credentials.

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: type-check, build, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan tracked files for committed credentials
        run: npm run check:secrets

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build the hospital application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify the hospital schema and demo data
        run: npm run hms:verify
