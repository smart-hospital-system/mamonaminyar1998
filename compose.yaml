name: ash-development
x-app: &app
  image: ash-enterprise:dev
  build: .
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
services:
  db:
    image: postgres:17-bookworm
    command: [postgres, -c, log_error_verbosity=terse, -c, log_statement=none, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_USER: ash_bootstrap
      POSTGRES_DB: ash
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [bootstrap_password, owner_password, app_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-ash-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ash_bootstrap -d ash']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    <<: *app
    environment:
      ASH_DATABASE_URL_FILE: /run/secrets/app_url
      # Loopback HTTP development only. For HTTPS deployment explicitly enable secure cookies.
      ASH_SECURE_COOKIE: ${ASH_SECURE_COOKIE:-0}
    secrets: [app_url]
    ports: ['127.0.0.1:${ASH_HTTP_PORT:-8000}:8000']
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=4)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  ops:
    <<: *app
    profiles: [tools]
    environment:
      ASH_DATABASE_URL_FILE: /run/secrets/owner_url
    secrets: [owner_url]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - backups:/backups
      - ./imports:/imports:ro
    stdin_open: true
    tty: true
    command: [python, -m, scripts.enterprise, --help]
secrets:
  bootstrap_password: {file: ./.secrets/bootstrap_password}
  owner_password: {file: ./.secrets/owner_password}
  app_password: {file: ./.secrets/app_password}
  owner_url: {file: ./.secrets/owner_url}
  app_url: {file: ./.secrets/app_url}
volumes:
  postgres_data:
  backups:
